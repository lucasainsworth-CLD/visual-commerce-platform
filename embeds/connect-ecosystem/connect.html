<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040711">
  <title>Cloudinary ecosystem</title>
  <link rel="stylesheet" href="./styles.css?v=20261111-7">
  <script defer src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script defer src="./app.js?v=20261111-7"></script>
</head>
<body>
  <main id="galaxy" aria-label="Interactive integration constellation" data-mode="ecosystem" aria-busy="true">
    <div id="scene" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="companies" role="group" aria-label="Companies. Drag to rotate, scroll to zoom. Arrow keys rotate; plus and minus zoom; Home resets the view."></div>
    <aside id="detail" aria-label="Company details" hidden>
      <button id="close-detail" type="button" aria-label="Close company details">×</button>
      <img id="detail-logo" alt="" hidden>
      <h2 id="detail-name"></h2>
      <p id="detail-category"></p>
      <a id="detail-link" target="_blank" rel="noopener noreferrer">View company ↗</a>
    </aside>
    <div class="view-controls" aria-label="View controls">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="reset" type="button" aria-label="Reset view" title="Reset view">↺</button>
    </div>
    <span id="gesture-hint">Drag to rotate · Scroll to explore</span>
    <nav class="mode-controls" aria-label="Connection model">
      <button type="button" data-mode="ecosystem" aria-pressed="true">E-Commerce Ecosystem</button>
      <button type="button" data-mode="prebuilt" aria-pressed="false">Pre-built Integrations</button>
      <button type="button" data-mode="custom" aria-pressed="false">API integrations</button>
    </nav>
    <p id="status" role="status">Loading…</p>
    <span id="mode-announcement" class="sr-only" aria-live="polite"></span>
    <noscript>This constellation requires JavaScript.</noscript>
  </main>
</body>
</html>
