<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloudinary — Visual Media Pipeline Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Cloudinary brand palette — brand-guidelines.cloudinary.com */
    --cloudinary-blue: #3448C5;   /* reserved for the logo only */
    --sky: #0D9AFF;               /* primary interactive accent */
    --grey: #E3E9EF;              /* light neutral / body text on dark */
    --aegean: #23436A;
    --cetacean: #1B295D;
    --turquoise: #48C4D8;
    --pink: #FE5981;
    --green: #D5FDA1;
    --teal: #60CFB7;
    --purple: #A15EE4;

    --ink: #16214A;
    --ink-2: #1B295D;
    --surface: #1F3560;
    --surface-2: #2A4577;
    --hair: rgba(227,233,239,0.16);
    --cream: #E3E9EF;
    --cream-dim: rgba(227,233,239,0.72);
    --cream-faint: rgba(227,233,239,0.46);
    --gold: #0D9AFF;
    --gold-soft: rgba(13,154,255,0.14);
    --teal-soft: rgba(96,207,183,0.16);
    --flag: #FE5981;
    --flag-soft: rgba(254,89,129,0.16);
    --accentgreen: #D5FDA1;
    --accentgreen-soft: rgba(213,253,161,0.14);
    --radius-lg: 22px;
    --radius-md: 14px;
    --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) {
      --ink: #16214A; --ink-2: #1B295D; --surface: #1F3560; --surface-2: #2A4577;
      --cream: #E3E9EF; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 700px at 15% -10%, #274b82 0%, var(--ink) 55%) fixed, var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 24px 100px;
  }

  /* ---------- Header ---------- */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 2px 22px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logochip {
    display: inline-flex; align-items: center; gap: 9px;
    background: #FFFFFF; border-radius: 999px; padding: 8px 16px 8px 12px;
  }
  .logochip img.icon { display: block; height: 22px; width: auto; }
  .logochip img.word { display: block; height: 15px; width: auto; }
  .heroLogo { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .heroLogo .chip {
    display: inline-flex; align-items: center; justify-content: center;
    background: #FFFFFF; border-radius: 18px; padding: 12px 16px;
  }
  .heroLogo .chip img { display: block; height: 34px; width: auto; }
  .brand .sub { font-size: 13px; color: var(--cream-dim); }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--hair); border: none; cursor: pointer; padding: 0;
    transition: transform .2s ease, background .2s ease;
  }
  .dot[aria-current="true"] { background: var(--sky); transform: scale(1.25); }
  .controls { display: flex; align-items: center; gap: 10px; }
  .iconbtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--hair); color: var(--cream);
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 8px 13px; border-radius: 999px; cursor: pointer;
  }
  .iconbtn:hover { border-color: rgba(243,239,230,0.32); }
  .iconbtn.off { opacity: 0.55; }
  .iconbtn:focus-visible, .dot:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  /* ---------- Stage frame ---------- */
  .stagewrap { position: relative; min-height: 560px; }
  .stage {
    display: none;
    animation: rise .38s ease both;
  }
  .stage.active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; } }

  /* Cover + Recap */
  .cover, .recap {
    text-align: left;
    padding: 40px 4px 10px;
    display: grid; gap: 22px;
  }
  .eyebrow-free-label { font-size: 14px; color: var(--gold); font-weight: 600; }
  .cover h1, .recap h1 {
    font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 4.4vw, 50px);
    line-height: 1.08; margin: 6px 0 4px; max-width: 28ch;
  }
  .cover p.lede, .recap p.lede {
    font-size: 17px; color: var(--cream-dim); max-width: 56ch; line-height: 1.6;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 10px; width: max-content;
    background: var(--sky); color: #0B1533; font-weight: 700; font-size: 15px;
    padding: 13px 22px; border-radius: 999px; border: none; cursor: pointer;
    font-family: var(--sans);
  }
  .cta:hover { filter: brightness(1.06); }
  .stagelist { display: grid; gap: 10px; margin-top: 4px; max-width: 620px; }
  .stagelist .row {
    display: flex; align-items: baseline; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--hair);
  }
  .stagelist .row .n { font-family: var(--serif); color: var(--gold); font-size: 15px; width: 22px; }
  .stagelist .row .t { font-weight: 600; font-size: 15px; }
  .customerproof {
    margin-top: 12px; display: flex; align-items: center; gap: 12px;
    background: var(--accentgreen-soft); border: 1px solid rgba(213,253,161,0.35);
    border-radius: var(--radius-md); padding: 11px 15px;
  }
  .customerproof .brand {
    font-family: var(--sans); font-weight: 700; font-size: 12.5px; color: var(--accentgreen);
    white-space: nowrap; padding-right: 12px; border-right: 1px solid rgba(213,253,161,0.3);
  }
  .customerproof .result { font-size: 13.5px; color: var(--cream); line-height: 1.4; }
  .customerproof .result b { color: var(--accentgreen); }

  .platformstat {
    margin-top: 12px; display: flex; align-items: center; gap: 12px;
    background: rgba(72,196,216,0.14); border: 1px solid rgba(72,196,216,0.38);
    border-radius: var(--radius-md); padding: 11px 15px;
  }
  .platformstat .v {
    font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--turquoise);
    white-space: nowrap; padding-right: 12px; border-right: 1px solid rgba(72,196,216,0.32);
  }
  .platformstat .l { font-size: 13.5px; color: var(--cream); line-height: 1.4; }

  .differentiators {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 6px;
  }
  @media (max-width: 860px) { .differentiators { grid-template-columns: 1fr; } }
  .differentiators .card {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius-md);
    padding: 18px 18px 20px;
  }
  .differentiators .card h3 {
    font-family: var(--serif); font-weight: 500; font-size: 19px; margin: 0 0 8px; color: var(--accentgreen);
  }
  .differentiators .card p { margin: 0; font-size: 13.5px; color: var(--cream-dim); line-height: 1.55; }

  .agentchat { display: grid; gap: 10px; }
  .agentchat .bubble { border-radius: 12px; padding: 10px 13px; font-size: 12.8px; line-height: 1.55; }
  .agentchat .who { font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 4px; color: var(--cream-faint); }

  .flowdiagram { display: flex; flex-direction: column; align-items: stretch; }
  .flownode {
    background: var(--ink-2); border: 1px solid var(--hair); border-radius: var(--radius-md);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .flownode .fn-badge {
    font-size: 11px; font-weight: 700; color: var(--sky); background: rgba(13,154,255,0.14);
    border: 1px solid rgba(13,154,255,0.35); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .flownode .fn-title { font-size: 13.5px; color: var(--cream); }
  .flownode .fn-branch { width: 100%; margin-top: 2px; font-size: 12px; color: var(--flag); padding-left: 2px; }
  .flownode.end { border-color: rgba(96,207,183,0.4); }
  .flownode.end .fn-badge { color: var(--teal); background: rgba(96,207,183,0.14); border-color: rgba(96,207,183,0.35); }
  .flowline { width: 2px; height: 14px; background: var(--hair); margin-left: 24px; }
  .agentchat .bubble.user { background: var(--surface-2); color: var(--cream); margin-left: 22px; }
  .agentchat .bubble.agent { background: var(--teal-soft); border: 1px solid rgba(96,207,183,0.35); color: var(--cream); margin-right: 8px; }
  .agentchat .bubble.agent .who { color: var(--teal); }

  .statstrip {
    display: flex; gap: 26px; flex-wrap: wrap; margin-top: 4px; padding: 16px 2px;
    border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
  }
  .statstrip .stat { display: flex; align-items: baseline; gap: 8px; }
  .statstrip .stat .v { font-family: var(--serif); font-size: 22px; color: var(--cream); }
  .statstrip .stat .l { font-size: 12px; color: var(--cream-faint); }

  /* Two-column stage layout */
  .stagegrid {
    display: grid; grid-template-columns: 1fr 1.28fr; gap: 34px;
    align-items: start; padding-top: 8px;
  }
  @media (max-width: 860px) { .stagegrid { grid-template-columns: 1fr; gap: 24px; } }

  .copy .step-tag {
    font-size: 13px; font-weight: 600; color: var(--gold);
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .copy .step-tag .no { font-family: var(--serif); font-size: 16px; }
  .copy h2 {
    font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 3vw, 34px);
    line-height: 1.12; margin: 0 0 12px; max-width: 13ch;
  }
  .copy ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .copy ul li {
    position: relative; padding-left: 18px; font-size: 15px; line-height: 1.55; color: var(--cream);
  }
  .copy ul li::before {
    content: ""; position: absolute; left: 0; top: 9px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--teal);
  }
  .proof {
    margin-top: 20px; background: var(--gold-soft); border: 1px solid rgba(13,154,255,0.32);
    border-radius: var(--radius-md); padding: 13px 16px; font-size: 14px; color: var(--cream);
  }
  .proof b { color: var(--gold); }
  .talkpopup {
    margin-top: 16px; position: relative; background: var(--surface-2);
    border: 1px solid rgba(96,207,183,0.35); border-radius: var(--radius-md);
    padding: 13px 40px 14px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    animation: popin .22s ease both;
  }
  @keyframes popin { from { opacity: 0; transform: translateY(4px) scale(0.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .talkpopup { animation: none; } }
  .talkpopup .talkhead {
    font-size: 12.5px; font-weight: 700; color: var(--teal); display: flex; align-items: center; gap: 7px; margin-bottom: 6px;
  }
  .talkpopup p { margin: 0; font-size: 14px; color: var(--cream-dim); line-height: 1.6; font-style: italic; }
  .talkclose {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    border: none; background: transparent; color: var(--cream-faint); font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .talkclose:hover { background: rgba(227,233,239,0.12); color: var(--cream); }

  .visual {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius-lg);
    padding: 20px; min-height: 320px;
  }
  .visual .figs { display: grid; gap: 14px; }
  .fig { background: var(--ink-2); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--hair); }
  .fig .imgbox { position: relative; background: #0B1020; display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .fig img { width: 100%; height: auto; object-fit: contain; }
  .fig .cap { padding: 9px 12px 11px; }
  .fig .cap .lbl { font-size: 12.5px; font-weight: 600; color: var(--cream); margin-bottom: 3px; }
  .fig .cap .url {
    font-family: var(--mono); font-size: 10.6px; color: var(--teal); word-break: break-all; line-height: 1.5;
  }
  .imgfallback {
    display: none; padding: 22px 16px; text-align: center; color: var(--cream-faint); font-size: 13px;
  }
  img.errored, video.errored { display: none; }
  img.errored + .imgfallback, video.errored + .imgfallback { display: block; }
  .fig video { width: 100%; height: auto; display: block; }

  .imgbox.portalbox { flex-direction: column; padding: 20px 16px; gap: 10px; min-height: 160px; }
  .portalbox .dztext { font-size: 13px; color: var(--cream-dim); text-align: center; }
  .portalbox .dztext b { color: var(--cream); }
  .portalbox .fileline {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--hair); border-radius: 8px; padding: 7px 10px;
  }
  .portalbox .fname { font-size: 11px; color: var(--cream); font-family: var(--mono); white-space: nowrap; }
  .portalbox .fbar { flex: 1; height: 5px; border-radius: 4px; background: var(--hair); overflow: hidden; }
  .portalbox .fbar i { display: block; height: 100%; background: var(--teal); }
  .portalbox .fpct { font-size: 11px; color: var(--teal); font-weight: 600; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 860px) { .row-3, .row-4 { grid-template-columns: repeat(2, 1fr); } }

  .badge {
    position: absolute; top: 8px; left: 8px; right: 8px; background: rgba(15,21,38,0.82);
    border: 1px solid var(--hair); color: var(--cream); font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 10px; line-height: 1.3; white-space: normal;
    width: fit-content; max-width: calc(100% - 16px);
  }
  .badge.live { color: var(--teal); border-color: rgba(96,207,183,0.4); }
  .badge.sim { color: var(--flag); border-color: rgba(254,89,129,0.4); }
  .badge.asset { color: var(--purple); border-color: rgba(161,94,228,0.45); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--cream-faint);
    padding: 0 2px 18px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .legend i.live { background: var(--teal); }
  .legend i.asset { background: var(--purple); }
  .legend i.sim { background: var(--flag); }

  .subhead {
    font-size: 12.5px; font-weight: 700; text-transform: none; color: var(--cream-dim);
    margin: 2px 0 2px; letter-spacing: 0.2px;
  }

  .jsonpanel {
    background: #0B1020; border: 1px solid var(--hair); border-radius: var(--radius-md);
    padding: 14px 16px; font-family: var(--mono); font-size: 12px; line-height: 1.65; color: #C9D6C9;
    overflow-x: auto;
  }
  .jsonpanel .k { color: #8FB8E0; }
  .jsonpanel .s { color: #D6B979; }
  .jsonpanel .tagline {
    font-size: 11px; color: var(--flag); font-family: var(--sans); font-weight: 600; margin-bottom: 8px;
  }

  .devices { display: grid; grid-template-columns: 0.6fr 0.85fr 1.3fr; gap: 12px; align-items: end; }
  .devices .device .cap { text-align: center; }
  @media (max-width: 860px) { .devices { grid-template-columns: 1fr; } }

  /* ---------- Footer nav ---------- */
  footer.nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(15,21,38,0) 0%, var(--ink) 30%);
    padding: 26px 0 calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .navbar {
    max-width: 1180px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .navbtn {
    background: var(--surface); border: 1px solid var(--hair); color: var(--cream);
    font-family: var(--sans); font-weight: 600; font-size: 14px;
    padding: 11px 18px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
  }
  .navbtn.primary { background: var(--sky); color: #0B1533; border-color: transparent; }
  .navbtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .progresswrap { flex: 1; max-width: 420px; display: flex; flex-direction: column; gap: 6px; }
  .progressbar { height: 3px; background: var(--hair); border-radius: 3px; overflow: hidden; }
  .progressbar > i { display: block; height: 100%; background: var(--gold); width: 0%; transition: width .1s linear; }
  .steplabel { font-size: 11.5px; color: var(--cream-faint); text-align: center; }

  @media (max-width: 640px) {
    .navbar { flex-wrap: wrap; }
    .progresswrap { order: 3; max-width: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">

  var CLOUD = "https://res.cloudinary.com/demo/image/upload/";

  function vid(t, id){ return CLOUDV + t + "/" + id; }

  var BADGE_TEXT = { live: "Live transformation", asset: "Real Cloudinary output", sim: "Illustrative" };
  function figure(label, url, kind, opts){
    opts = opts || {};

    if (kind === false) kind = "sim";
    var shortUrl = url.replace("https://res.cloudinary.com/", "").replace("https://cloudinary-marketing-res.cloudinary.com/", "");

          '<div class="imgfallback">Live image is processing on Cloudinary\'s shared demo cloud — reload in a moment, or narrate from this description: <em>'+(opts.fallback||label)+'</em></div>' +
        '</div>' +
        '<div class="cap"><div class="lbl">'+label+'</div><div class="url">'+shortUrl+'</div></div>' +
      '</div>'
    );
  }

    fill.style.width = "0%";
    clearTimeout(timer); clearInterval(tickTimer);
    if (autoplay && !stages[current].kind) scheduleStep();
  }
  function scheduleStep(){
    var s = stages[current];
    var dur = (s.duration || 20) * 1000;
    clearInterval(tickTimer);
    tickTimer = setInterval(function(){
      elapsed += 100;
      var pct = Math.min(100, (elapsed / dur) * 100);
      document.getElementById("progressFill").style.width = pct + "%";
    }, 100);
    timer = setTimeout(function(){
      if (current >= stages.length - 2) { stopAutoplay(); goTo(stages.length - 1); return; }
      next();
    }, dur);
  }

  buildDots();
  render();
})();
</script>
</body>
</html>
